name: Android Release

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.2.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Setting version to $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version

          # Update build.gradle versionName and versionCode
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          # Generate versionCode from version (e.g., 2.2.0 -> 20200)
          VERSION_CODE=$(echo $VERSION | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle

      - name: Lint
        run: npx biome check

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyStudyTracker-v${{ env.VERSION }}
          path: android/app/build/outputs/apk/release/DailyStudyTracker.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.VERSION }}
          name: "Daily Study Tracker v${{ env.VERSION }}"
          body: |
            ## What's New in v${{ env.VERSION }}

            ### Architecture
            - Full TypeScript migration (strict mode, zero `any`)
            - Provider-based architecture (Theme, Data, Toast, ErrorBoundary)
            - Code-split routes for optimal loading

            ### Features
            - Material Design 3 theme system (6 themes + adaptive color picker)
            - Input sanitization for XSS prevention
            - PWA support with offline capability
            - Error boundaries with graceful recovery
            - Skeleton loading states

            ### Quality
            - 56 comprehensive tests
            - Biome linting (0 errors, 0 warnings)
            - CI/CD pipeline with automated testing

            ### Performance
            - 50% bundle size reduction (929KB → 457KB)
            - Lazy-loaded route chunks
            - Extensive memoization

            ---
            **Install:** Download the APK and install on your Android device.
          files: android/app/build/outputs/apk/release/DailyStudyTracker.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
