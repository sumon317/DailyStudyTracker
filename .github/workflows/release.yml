name: Android Release

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.2.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set Version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Setting version to $VERSION"
          npm version $VERSION --no-git-tag-version --allow-same-version

          # Update build.gradle versionName and versionCode
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          # Generate versionCode from version (e.g., 2.2.1 -> 20201)
          VERSION_CODE=$(echo $VERSION | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle

      - name: Lint
        run: npx biome check

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyStudyTracker-v${{ env.VERSION }}
          path: android/app/build/outputs/apk/release/DailyStudyTracker.apk
          retention-days: 30

      - name: Generate Changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # If no previous tag, show last 20 commits
            CHANGES=$(git log --oneline -20 --format="- %s")
          else
            # Get commits since previous tag
            CHANGES=$(git log $PREV_TAG..HEAD --format="- %s")
          fi
          
          # Create changelog
          cat << EOF > changelog.md
          ## What's New in v${{ env.VERSION }}

          ### 🐛 Bug Fixes
          - Fixed Todo alarm firing immediately instead of at scheduled time
          - Fixed TodoPage setTodos using stale closures
          - Fixed exportData returning meaningless count
          - Fixed ErrorLog removeError using wrong filter (index vs id)
          - Fixed CountdownTimer useEffect re-running every second
          - Fixed TrackerForm day indicators (Mon=1, not Mon=0)
          - Fixed StudyCharts using subject.name as key (duplicates)
          - Fixed App.tsx update check running on every date change
          - Fixed DataProvider generateId collisions across tabs

          ### ✨ Features
          - Web Notifications support for todo reminders (uses browser Notification API)
          - Auto-update system with modal popup and progress bar
          - "Check Updates" button in header menu
          - Widget auto-updates every 10 seconds on data save

          ### 🎨 Improvements
          - Reduced audio file size (5.9MB → 1.4MB)
          - Compressed PNG assets (~2MB → 36KB)
          - Added ProGuard rules for release builds
          - Added reduced-motion support for accessibility
          - Optimized build with code splitting and terser minification

          ### 🧪 Testing
          - Added 34 new unit tests for utils
          - Total tests: 90+

          ### 📦 Build
          - Bundle size: ~2.9MB (gzipped)
          - APK will be generated automatically

          ---

          **Install:** Download the APK below and install on your Android device.
          EOF
          
          cat changelog.md
          echo "CHANGES<<EOF" >> $GITHUB_ENV
          cat changelog.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.VERSION }}
          name: "Daily Study Tracker v${{ env.VERSION }}"
          body: ${{ env.CHANGES }}
          files: android/app/build/outputs/apk/release/DailyStudyTracker.apk
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
